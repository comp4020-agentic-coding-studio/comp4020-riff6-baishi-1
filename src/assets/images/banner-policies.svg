<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <rect width="1600" height="600" fill="#12100c"/>

  <!-- raking light over the desk -->
  <g fill="#1c1813">
    <polygon points="60,0 300,0 160,500 -80,500"/>
    <polygon points="700,0 840,0 700,500 560,500"/>
    <polygon points="1240,0 1560,0 1420,500 1100,500"/>
  </g>

  <!-- the desk -->
  <rect x="0" y="500" width="1600" height="10" fill="#8a5c13"/>
  <rect x="0" y="510" width="1600" height="90" fill="#0b0906"/>

  <!-- the ledger, open: the record on one page, the declaration on the other -->
  <rect x="520" y="120" width="300" height="380" fill="#f2e6cf" opacity="0.92"/>
  <rect x="840" y="120" width="300" height="380" fill="#f2e6cf" opacity="0.92"/>
  <rect x="820" y="120" width="20" height="380" fill="#8a5c13"/>
  <g fill="#8a5c13">
    <rect x="550" y="170" width="240" height="7"/>
    <rect x="550" y="204" width="240" height="7"/>
    <rect x="550" y="238" width="196" height="7"/>
    <rect x="550" y="272" width="240" height="7"/>
    <rect x="550" y="306" width="240" height="7"/>
    <rect x="550" y="340" width="162" height="7"/>
    <rect x="550" y="392" width="240" height="7"/>
    <rect x="550" y="426" width="208" height="7"/>
    <rect x="870" y="170" width="240" height="7"/>
    <rect x="870" y="204" width="240" height="7"/>
    <rect x="870" y="238" width="184" height="7"/>
    <rect x="870" y="272" width="240" height="7"/>
    <rect x="870" y="306" width="132" height="7"/>
  </g>

  <!-- where the declaring happens: a hand signature over its rule -->
  <path d="M876 404 Q902 356 918 404 Q934 452 956 396 Q974 352 992 404 Q1008 444 1038 384 L1068 404"
    fill="none" stroke="#12100c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="870" y="428" width="240" height="5" fill="#8a5c13"/>

  <!-- the wax seal, ribbon still attached -->
  <polygon points="300,432 356,432 344,520 276,520" fill="#8a5c13"/>
  <polygon points="332,432 388,432 412,520 344,520" fill="#b97d1c"/>
  <circle cx="330" cy="382" r="70" fill="#b97d1c"/>
  <circle cx="330" cy="382" r="52" fill="#8a5c13"/>
  <path d="M330 344 L352 364 L344 394 L316 394 L308 364 Z" fill="#b97d1c"/>
  <circle cx="330" cy="382" r="70" fill="none" stroke="#d9a441" stroke-width="5"/>

  <!-- the matrix that pressed it, and the wax pot -->
  <ellipse cx="1300" cy="318" rx="58" ry="27" fill="#b97d1c"/>
  <rect x="1286" y="330" width="28" height="90" fill="#b97d1c"/>
  <rect x="1244" y="418" width="112" height="46" fill="#8a5c13"/>
  <rect x="1244" y="464" width="112" height="8" fill="#d9a441"/>
  <rect x="1432" y="404" width="86" height="68" fill="#8a5c13"/>
  <rect x="1424" y="390" width="102" height="16" fill="#b97d1c"/>
  <rect x="1432" y="438" width="86" height="34" fill="#b97d1c"/>
</svg>
