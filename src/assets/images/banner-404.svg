<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <rect width="1600" height="600" fill="#12100c"/>

  <!-- the lamp the note is being held up against -->
  <circle cx="900" cy="300" r="250" fill="#8a5c13" opacity="0.4"/>
  <circle cx="900" cy="300" r="180" fill="#8a5c13" opacity="0.3"/>

  <!-- the note -->
  <rect x="440" y="160" width="700" height="300" fill="#8a5c13"/>
  <rect x="456" y="176" width="668" height="268" fill="none" stroke="#d9a441" stroke-width="4"/>

  <!-- guilloche rosette -->
  <g>
    <circle cx="606" cy="310" r="92" fill="#b97d1c"/>
    <circle cx="606" cy="310" r="68" fill="#8a5c13"/>
    <circle cx="606" cy="310" r="44" fill="#b97d1c"/>
    <circle cx="606" cy="310" r="20" fill="#8a5c13"/>
    <g stroke="#8a5c13" stroke-width="4">
      <path d="M514 310 L698 310 M606 218 L606 402"/>
      <path d="M541 245 L671 375 M671 245 L541 375"/>
    </g>
  </g>

  <!-- denomination bars and serial marks: everything else is in order -->
  <g fill="#b97d1c">
    <rect x="490" y="418" width="70" height="10"/>
    <rect x="572" y="418" width="46" height="10"/>
    <rect x="630" y="418" width="58" height="10"/>
    <rect x="1000" y="196" width="26" height="9"/>
    <rect x="1034" y="196" width="26" height="9"/>
    <rect x="1068" y="196" width="26" height="9"/>
  </g>

  <!-- the security thread is there, threaded through as it should be -->
  <path d="M790 160 L790 460" stroke="#d9a441" stroke-width="9" stroke-dasharray="26 16"/>

  <!-- and where the watermark should be, the light goes straight through -->
  <ellipse cx="968" cy="310" rx="88" ry="114" fill="#b97d1c"/>
  <ellipse cx="968" cy="310" rx="88" ry="114" fill="none" stroke="#12100c" stroke-width="6"
    stroke-dasharray="20 18"/>

  <!-- corner brackets -->
  <g stroke="#d9a441" stroke-width="6" fill="none">
    <path d="M480 200 L480 176 L504 176"/>
    <path d="M1100 200 L1100 176 L1076 176"/>
    <path d="M480 420 L480 444 L504 444"/>
    <path d="M1100 420 L1100 444 L1076 444"/>
  </g>
</svg>
