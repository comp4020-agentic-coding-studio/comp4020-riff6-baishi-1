<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <rect width="1600" height="600" fill="#12100c"/>

  <!-- raking light across the studio wall -->
  <g fill="#1c1813">
    <polygon points="0,0 210,0 70,440 -140,440"/>
    <polygon points="520,0 660,0 520,440 380,440"/>
    <polygon points="1150,0 1470,0 1330,440 1010,440"/>
  </g>

  <!-- the bench: top surface, lit front edge, body -->
  <rect x="0" y="440" width="1600" height="70" fill="#1c1813"/>
  <rect x="0" y="510" width="1600" height="8" fill="#b97d1c"/>
  <rect x="0" y="518" width="1600" height="82" fill="#0b0906"/>

  <!-- solvent bottle, pigment jar, medium jar -->
  <g fill="#8a5c13">
    <rect x="200" y="300" width="68" height="140"/>
    <rect x="220" y="268" width="28" height="34"/>
    <rect x="300" y="340" width="90" height="100"/>
    <rect x="415" y="372" width="55" height="68"/>
  </g>
  <rect x="215" y="256" width="38" height="16" fill="#b97d1c"/>
  <rect x="207" y="340" width="54" height="46" fill="#f2e6cf" opacity="0.8"/>
  <rect x="294" y="328" width="102" height="16" fill="#b97d1c"/>
  <rect x="300" y="386" width="90" height="54" fill="#b97d1c"/>
  <rect x="410" y="362" width="65" height="14" fill="#d9a441"/>

  <!-- table easel, and the panel resting on its tray -->
  <g fill="#8a5c13">
    <polygon points="660,440 692,440 840,150 820,150"/>
    <polygon points="1030,440 998,440 850,150 870,150"/>
    <rect x="690" y="355" width="310" height="16"/>
  </g>

  <!-- the panel, half of it freshly laid in, half aged by hand -->
  <rect x="715" y="175" width="130" height="180" fill="#b97d1c"/>
  <rect x="845" y="175" width="130" height="180" fill="#8a5c13"/>
  <rect x="715" y="175" width="6" height="180" fill="#f2e6cf" opacity="0.6"/>
  <g stroke="#12100c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M845 214 L890 236 L862 274 L902 310 L878 355"/>
    <path d="M890 236 L936 220 L975 246"/>
    <path d="M902 310 L948 296 L975 320"/>
    <path d="M862 274 L916 268 L975 288"/>
    <path d="M936 220 L930 175"/>
    <path d="M948 296 L942 355"/>
  </g>

  <!-- brush pot -->
  <rect x="1160" y="350" width="100" height="90" fill="#8a5c13"/>
  <g stroke-width="9" stroke-linecap="round">
    <path d="M1180 360 L1156 236" stroke="#8a5c13"/>
    <path d="M1206 360 L1200 224" stroke="#8a5c13"/>
    <path d="M1232 360 L1256 246" stroke="#8a5c13"/>
    <path d="M1156 236 L1148 200" stroke="#d9a441"/>
    <path d="M1200 224 L1196 186" stroke="#d9a441"/>
    <path d="M1256 246 L1266 212" stroke="#d9a441"/>
  </g>
  <g fill="#f2e6cf">
    <polygon points="1142,200 1154,200 1150,172"/>
    <polygon points="1190,186 1202,186 1198,158"/>
    <polygon points="1260,212 1272,212 1274,184"/>
  </g>

  <!-- small edge tools, laid out on the bench top -->
  <rect x="205" y="472" width="125" height="12" rx="6" fill="#8a5c13"/>
  <polygon points="330,470 400,478 330,486" fill="#d9a441"/>
  <rect x="1180" y="468" width="70" height="24" rx="12" fill="#8a5c13"/>
  <rect x="1250" y="476" width="140" height="8" fill="#b97d1c"/>
  <polygon points="1390,475 1414,480 1390,485" fill="#f2e6cf"/>
