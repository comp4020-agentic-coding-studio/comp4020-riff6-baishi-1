<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="960" height="1200">
  <title>Dr Petra Voss</title>
  <rect width="960" height="1200" fill="#f2e6cf"/>

  <!-- the conservator's backdrop: a stretched canvas seen edge-on -->
  <rect x="120" y="120" width="720" height="720" fill="#e8d8ba"/>
  <rect x="120" y="120" width="720" height="720" fill="none" stroke="#8a5c13" stroke-width="10"/>
  <path d="M120 120 840 840M840 120 120 840" stroke="#8a5c13" stroke-width="6" opacity="0.28"/>
  <circle cx="480" cy="420" r="250" fill="#b97d1c" opacity="0.18"/>

  <!-- raking light from the left -->
  <path d="M0 0 340 0 0 620Z" fill="#f7eedd" opacity="0.75"/>

  <!-- shoulders and torso -->
  <path d="M232 1200c0-224 110-348 248-348s248 124 248 348Z" fill="#12100c"/>
  <!-- collar -->
  <path d="M398 872l82 116 82-116-46-22-72 0Z" fill="#f2e6cf"/>
  <path d="M414 880 480 988 546 880" fill="none" stroke="#8a5c13" stroke-width="9" stroke-linejoin="round"/>
  <!-- lapel seams -->
  <path d="M316 1012c22 64 30 122 30 188M644 1012c-22 64-30 122-30 188" fill="none" stroke="#8a5c13" stroke-width="7" opacity="0.8"/>

  <!-- neck -->
  <path d="M438 760h84v112h-84Z" fill="#8a5c13"/>

  <!-- head -->
  <ellipse cx="480" cy="616" rx="152" ry="182" fill="#12100c"/>
  <!-- hair swept back into a low bun -->
  <path d="M328 592c0-118 68-192 152-192s152 74 152 192c-28-62-84-96-152-96s-124 34-152 96Z" fill="#1c1813"/>
  <circle cx="480" cy="404" r="0" fill="none"/>
  <path d="M600 726c46 10 78 44 78 84s-32 70-78 74" fill="#1c1813"/>
  <!-- brow line and cheekbone, the only features: flat stylisation, not a face -->
  <path d="M404 596h60M516 596h60" stroke="#d9a441" stroke-width="12" stroke-linecap="round"/>
  <path d="M480 642v52" stroke="#8a5c13" stroke-width="9" stroke-linecap="round"/>

  <!-- the loupe, held up to the work -->
  <g transform="translate(716 560) rotate(-18)">
    <rect x="-16" y="60" width="32" height="150" rx="14" fill="#12100c"/>
    <circle cx="0" cy="0" r="96" fill="#f7eedd"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#12100c" stroke-width="22"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#b97d1c" stroke-width="10"/>
    <!-- magnified craquelure: the thing she is actually looking at -->
    <path d="M-48-10 -10-34 22-6 56-28M-40 30 -4 14 30 40 58 22" fill="none" stroke="#8a5c13" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- hand -->
  <path d="M628 742c36-26 74-34 100-14s18 58-14 78-72 14-92-10Z" fill="#8a5c13"/>
</svg>
